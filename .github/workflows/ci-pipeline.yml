name: Run Tests

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]

# Least-privilege by default; only publish-npm opts up to write.
permissions:
  contents: read

# Cancel superseded runs on PRs, but never interrupt a main/tag run mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier
        run: npm run prettier

  build:
    name: Build Bundle
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build Files
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # jsdom's undici requires Node >=22.19. Older runtimes are covered
        # by the runtime-test job against the built bundle.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Run Tests
        run: npm test
      - name: Check Types
        # test:env type-checks the built declarations as consumed from DOM, Node, web worker and bare environments
        run: npm run test:types && npm run test:env
      - name: Run Runtime Test
        run: npm run test:runtime
      - name: Check Package Exports
        # types and runtime entry points agree for require, import and bundlers
        run: npm run test:package
      - name: Check tree-shakeability
        run: npx agadoo

  runtime-test:
    name: Runtime Test (legacy Node)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runtimes the library supports but the vitest toolchain can't run on.
        # Loads the built package via require and import to prove it still works.
        node-version: [16, 18, 20]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Run Runtime Test
        run: npm run test:runtime

  publish-npm:
    name: Publish to NPM
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, runtime-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC trusted publishing to npm (no token)
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: NPM Publish
        # Auth is via OIDC (id-token) — no NODE_AUTH_TOKEN. npm also attaches
        # a provenance statement automatically under trusted publishing.
        run: npm publish
      - name: Github Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
